# Secrets from the cluster's OpenBao (ClusterSecretStore openbao-calendar-sync,
# kv v2 mount `kv`, path `calendar-sync`). remoteRef.key is the kv path and
# remoteRef.property the field inside it; a missing field fails the whole
# ExternalSecret (the existing Secret is kept).
#
# The three file secrets keep the exact keys the CronJob mounts by subPath
# (config.yaml, google_client_secret.json, google_client_secret2.json).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: calendar-sync-config
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openbao-calendar-sync
    kind: ClusterSecretStore
  target:
    name: calendar-sync-config
    creationPolicy: Owner
  data:
    - secretKey: config.yaml
      remoteRef:
        key: calendar-sync
        property: CALENDAR_SYNC_CONFIG
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: calendar-sync-secrets
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openbao-calendar-sync
    kind: ClusterSecretStore
  target:
    name: calendar-sync-secrets
    creationPolicy: Owner
  data:
    - secretKey: google_client_secret.json
      remoteRef:
        key: calendar-sync
        property: GOOGLE_CLIENT_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: calendar-sync-secrets2
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openbao-calendar-sync
    kind: ClusterSecretStore
  target:
    name: calendar-sync-secrets2
    creationPolicy: Owner
  data:
    - secretKey: google_client_secret2.json
      remoteRef:
        key: calendar-sync
        property: GOOGLE_CLIENT_SECRET2
---
# UPTRACE_DSN (telemetry ingest, contains a token) → CronJob env via secretKeyRef.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: calendar-sync-env
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openbao-calendar-sync
    kind: ClusterSecretStore
  target:
    name: calendar-sync-env
    creationPolicy: Owner
  data:
    - secretKey: UPTRACE_DSN
      remoteRef:
        key: calendar-sync
        property: UPTRACE_DSN
