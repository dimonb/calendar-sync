# calendar-sync — mirrors calendar "busy" events between calendars, every 5 min
# (bar the :00 tick — see the note at spec.schedule).
#
# GitOps deploy (GEH/wit-style): the image tag is pinned by kustomize's `images:`
# block in kustomization.yaml. On `main` that tag is the inert `latest`
# placeholder; the CI `promote` job rewrites it to the built commit SHA on the
# generated `deploy/main` branch, which ArgoCD reconciles. So the running version
# is immutable and git-tracked (rollback = revert the bump commit) — hence
# imagePullPolicy: IfNotPresent, not the old :latest + Always.
#
# Config/creds are mounted from ExternalSecret-materialised secrets (Infisical
# /calendar-sync); OAuth tokens + the sqlite DB live on the adopted PVC (not git).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: calendar-sync
spec:
  # 5-55/5, not */5: no tick at :00 of any hour, to keep a job pod of ours from
  # being Running when the nightly Velero backup starts.
  #
  # The k8s-dibot Velero schedule velero-daily-backup ("0 3 * * *",
  # kustomize/velero/velero-values.yaml) fired at 03:00:19 on 2026-09-30. The
  # */5 pod started at 03:00:00 was still Running, so Velero anchored the
  # calendar-sync-pvc PodVolumeBackup to it; the pod then exited (~81s) and
  # kubelet removed its volume dir before the backup could mount it, the PVB
  # was canceled, and the backup came back PartiallyFailed
  # (PVB velero-daily-backup-20260930030019-xhglk).
  #
  # With no :00 tick the 02:55 run (longest observed 197s, so done by ~02:58)
  # has already finished at backup start. Its pod still EXISTS then —
  # ttlSecondsAfterFinished is 600 and the history limits are the defaults —
  # but in phase Succeeded, and Velero skips it because it is not Running, not
  # because it is gone. The PVB then anchors to the Running velero-pvc-holder
  # pod, which is there for exactly that.
  #
  # This narrows the window, it does not close it: nothing here bounds a run's
  # duration or how late a missed tick may start (no activeDeadlineSeconds, no
  # startingDeadlineSeconds), so a 02:55 run that overruns, retries, or is
  # deferred by concurrencyPolicy: Forbid can still be Running at 03:00.
  #
  # COUPLED to the Velero schedule's MINUTE, not its hour: 5-55/5 skips :00 of
  # every hour, so moving the backup to another hour at :00 stays safe, while
  # moving it to any other five-minute mark (03:30, say) reinstates the race.
  # Cost: a 10-minute sync gap once an hour (:55 -> :05) instead of 5.
  # This is a MITIGATION, not a proven fix — only a natural Velero run
  # confirms it.
  schedule: "5-55/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: calendar-sync
              # Tag is set by kustomize (see kustomization.yaml `images:`).
              image: "ghcr.io/dimonb/calendar-sync/calendar-sync:latest"
              imagePullPolicy: IfNotPresent
              env:
                - name: OLTP_EXPORTER_ENDPOINT
                  value: ""
                - name: CONFIG_PATH
                  value: "/data/config.yaml"
                - name: UPTRACE_DSN
                  valueFrom:
                    secretKeyRef:
                      name: calendar-sync-env
                      key: UPTRACE_DSN
                - name: DEPLOY_ENV
                  value: "production"
                - name: LOG_LEVEL
                  value: "DEBUG"
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: config
                  mountPath: /data/config.yaml
                  subPath: config.yaml
                - name: google-creds
                  mountPath: /data/google_client_secret.json
                  subPath: google_client_secret.json
                - name: google-creds2
                  mountPath: /data/google_client_secret2.json
                  subPath: google_client_secret2.json
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
          volumes:
            - name: config
              secret:
                secretName: calendar-sync-config
            - name: google-creds
              secret:
                secretName: calendar-sync-secrets
            - name: google-creds2
              secret:
                secretName: calendar-sync-secrets2
            - name: data
              persistentVolumeClaim:
                claimName: calendar-sync-pvc
